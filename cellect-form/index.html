<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书借阅登记</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>图书借阅登记</h1>
    <p>填写以下信息完成图书借阅</p>
  </header>
  <nav>
    <a href="#intro">填写说明</a>
    <a href="#form">开始登记</a>
  </nav>
  <main>
    <section id="intro">
      <h2>填写说明</h2>
      <p>请如实填写借阅信息，带 * 为必填项，填写完成后点击提交。</p>
    </section>
    <section id="form">
      <h2>借阅登记表</h2>
      <form action="#" method="get">
        <fieldset>
          <legend>基本信息</legend>
          <p>
            <label for="name">姓名 *</label>
            <input type="text" id="name" name="name" placeholder="请输入姓名" required>
          </p>
          <p>
            <label for="sid">学号 *</label>
            <input type="text" id="sid" name="sid" placeholder="请输入学号" pattern="[0-9]{10}" required>
          </p>
          <p>性别 *</p>
          <p>
            <label><input type="radio" name="gender" value="male" required> 男</label>
            <label><input type="radio" name="gender" value="female"> 女</label>
          </p>
          <p>
            <label for="dept">所在院系 *</label>
            <input type="text" id="dept" name="dept" placeholder="请输入所在院系" required>
          </p>
          <p>
            <label for="phone">常用电话 *</label>
            <input type="tel" id="phone" name="phone" placeholder="请输入11位手机号" pattern="[0-9]{11}" required>
          </p>
          <p>
            <label for="mail">邮箱</label>
            <input type="email" id="mail" name="mail" placeholder="选填，用于接收通知">
          </p>
        </fieldset>
        <fieldset>
          <legend>借阅信息</legend>
          <p>
            <label for="book">图书名称 *</label>
            <input type="text" id="book" name="book" placeholder="请输入书名" required>
          </p>
          <p>
            <label for="count">借阅数量 *</label>
            <input type="number" id="count" name="count" min="1" max="5" value="1" required>
          </p>
          <p>
            <label for="date">借用时间 *</label>
            <input type="date" id="date" name="date" required>
          </p>
          <p>借阅类型</p>
          <p>
            <label><input type="radio" name="type" value="personal"> 个人借阅</label>
            <label><input type="radio" name="type" value="group"> 小组借阅</label>
          </p>
          <p>归还方式（可多选）</p>
          <p>
            <label><input type="checkbox" name="return" value="self"> 自助归还</label>
            <label><input type="checkbox" name="return" value="front"> 前台归还</label>
          </p>
          <p>
            <label for="remark">备注</label><br>
            <textarea id="remark" name="remark" rows="4" maxlength="200" placeholder="其他需要说明的事项"></textarea>
          </p>
        </fieldset>
        <p>
          <button type="submit">提交登记</button>
          <button type="reset">重置</button>
        </p>
      </form>
    </section>
  </main>
  <footer>
    <p>软件开发综合实践 · 自主实践</p>
  </footer>
</body>
</html>
